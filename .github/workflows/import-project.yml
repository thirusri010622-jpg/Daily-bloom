name: Import Daily Bloom Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project into correct folders
        run: |
          unzip -o DailyBloom_Complete_Project-1.zip -d /tmp/dailybloom
          rsync -a /tmp/dailybloom/DailyBloomAndroid/ ./
          rm -f DailyBloom_Complete_Project-1.zip

      - name: Commit project structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Daily Bloom Android project" || echo "No changes to commit"
          git push
